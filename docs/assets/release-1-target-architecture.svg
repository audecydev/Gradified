<text x="1000" y="34" text-anchor="middle" class="t">Gradified Grading Engine - Release 1 Target Architecture</text>
<text x="1000" y="56" text-anchor="middle" class="sm">Target architecture. See ARCHITECTURE.md for current implementation status and open work.</text>
<rect x="20" y="80" width="350" height="650" rx="8" class="cl"/><text x="32" y="104" class="ct">A. Platform Trust / Authorization / Job Boundary</text>
<rect x="55" y="120" width="280" height="52" rx="6" class="b"/>
<text x="195.0" y="139" text-anchor="middle" class="bt">Frontend / LMS / Internal Service</text>
<text x="195.0" y="156" text-anchor="middle" class="sm">authenticated request</text>
<rect x="55" y="192" width="280" height="52" rx="6" class="b"/>
<text x="195.0" y="211" text-anchor="middle" class="bt">Backend API / Workflow Boundary</text>
<text x="195.0" y="228" text-anchor="middle" class="sm">technology-neutral</text>
<rect x="55" y="264" width="280" height="52" rx="6" class="b"/>
<text x="195.0" y="283" text-anchor="middle" class="bt">Authentication / Service Identity</text>
<text x="195.0" y="300" text-anchor="middle" class="sm">verify user/service credential</text>
<rect x="55" y="336" width="280" height="52" rx="6" class="b"/>
<text x="195.0" y="355" text-anchor="middle" class="bt">TrustedTenantContext</text>
<text x="195.0" y="372" text-anchor="middle" class="sm">derived only from verified identity</text>
<rect x="55" y="408" width="280" height="52" rx="6" class="b"/>
<text x="195.0" y="427" text-anchor="middle" class="bt">Authorization / RBAC</text>
<text x="195.0" y="444" text-anchor="middle" class="sm">tenant + exam + submission permissions</text>
<rect x="55" y="480" width="280" height="52" rx="6" class="b"/>
<text x="195.0" y="499" text-anchor="middle" class="bt">Authorized Store / Asset Access</text>
<text x="195.0" y="516" text-anchor="middle" class="sm">tenant-isolated spec/result/reference/OCR refs</text>
<rect x="55" y="552" width="280" height="52" rx="6" class="b"/>
<text x="195.0" y="571" text-anchor="middle" class="bt">Ingress + Job Admission</text>
<text x="195.0" y="588" text-anchor="middle" class="sm">schema, size, idempotency, job limits</text>
<rect x="55" y="624" width="280" height="52" rx="6" class="b"/>
<text x="195.0" y="643" text-anchor="middle" class="bt">Async Job / Reliability Control</text>
<text x="195.0" y="660" text-anchor="middle" class="sm">queue, retries, timeout, attempt IDs, backpressure</text>
