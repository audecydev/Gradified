<path d="M195,460 L195,480" class="ar"/>
<path d="M195,532 L195,552" class="ar"/>
<path d="M195,604 L195,624" class="ar"/>
<rect x="390" y="80" width="520" height="390" rx="8" class="cl"/><text x="402" y="104" class="ct">B. Assessment Authority / Rubric Authoring</text>
<rect x="440" y="120" width="420" height="58" rx="6" class="b"/>
<text x="650.0" y="139" text-anchor="middle" class="bt">School-Authorized Inputs</text>
<text x="650.0" y="156" text-anchor="middle" class="sm">question, max marks, model answer, approved references</text>
<rect x="440" y="198" width="420" height="58" rx="6" class="b"/>
<text x="650.0" y="217" text-anchor="middle" class="bt">Rubric Generator</text>
<text x="650.0" y="234" text-anchor="middle" class="sm">produces RubricDraft</text>
<rect x="440" y="276" width="420" height="58" rx="6" class="b"/>
<text x="650.0" y="295" text-anchor="middle" class="bt">Rubric Linter + Deterministic Compiler</text>
<text x="650.0" y="312" text-anchor="middle" class="sm">IDs, levels, marks, dependencies, caps/deductions, limits</text>
<rect x="440" y="354" width="420" height="58" rx="6" class="b"/>
<text x="650.0" y="373" text-anchor="middle" class="bt">Teacher Approval -&gt; ACTIVE GradingSpec</text>
<text x="650.0" y="390" text-anchor="middle" class="sm">exact version/content; ACTIVE immutable for a run</text>
<path d="M650,178 L650,198" class="ar"/>
<path d="M650,256 L650,276" class="ar"/>
<path d="M650,334 L650,354" class="ar"/>
<rect x="930" y="80" width="400" height="290" rx="8" class="cl"/><text x="942" y="104" class="ct">C. Student Evidence Boundary</text>
<rect x="980" y="125" width="300" height="54" rx="6" class="b"/>
<text x="1130.0" y="144" text-anchor="middle" class="bt">OCR Output</text>
<text x="1130.0" y="161" text-anchor="middle" class="sm">external OCR schema</text>
<rect x="980" y="205" width="300" height="54" rx="6" class="b"/>
<text x="1130.0" y="224" text-anchor="middle" class="bt">OCR Adapter</text>
<text x="1130.0" y="241" text-anchor="middle" class="sm">normalize real payload; no vendor fields in core</text>
<rect x="980" y="285" width="300" height="54" rx="6" class="b"/>
<text x="1130.0" y="304" text-anchor="middle" class="bt">AnswerEvidenceBundle</text>
<text x="1130.0" y="321" text-anchor="middle" class="sm">student evidence only; IDs, content/type, uncertainty, provenance</text>
<path d="M1130,179 L1130,205" class="ar"/>
<path d="M1130,259 L1130,285" class="ar"/>
<rect x="1350" y="80" width="630" height="650" rx="8" class="cl"/><text x="1362" y="104" class="ct">E. Supporting / Cross-Cutting Controls</text>
<rect x="1400" y="120" width="530" height="54" rx="6" class="b"/>
<text x="1665.0" y="139" text-anchor="middle" class="bt">Secret Infrastructure</text>
<text x="1665.0" y="156" text-anchor="middle" class="sm">provider credentials by reference only</text>
<rect x="1400" y="194" width="530" height="54" rx="6" class="b"/>
<text x="1665.0" y="213" text-anchor="middle" class="bt">Model Provider Adapter</text>
<text x="1665.0" y="230" text-anchor="middle" class="sm">validated request/response, health, cost/usage metadata</text>
<rect x="1400" y="268" width="530" height="54" rx="6" class="b"/>
<text x="1665.0" y="287" text-anchor="middle" class="bt">RetrievalPort / Reference Adapter</text>
<text x="1665.0" y="304" text-anchor="middle" class="sm">approved tenant/version-filtered context; index is not authority</text>
<rect x="1400" y="342" width="530" height="54" rx="6" class="b"/>
<text x="1665.0" y="361" text-anchor="middle" class="bt">Reference Context + Provenance Boundary</text>
<text x="1665.0" y="378" text-anchor="middle" class="sm">source/version/opaque hash; bounded immutable snapshot</text>
<rect x="1400" y="416" width="530" height="54" rx="6" class="b"/>
<text x="1665.0" y="435" text-anchor="middle" class="bt">Audit / Provenance / Telemetry</text>
<text x="1665.0" y="452" text-anchor="middle" class="sm">versions, source/evidence refs, retries, latency, tokens, cost</text>
<rect x="1400" y="490" width="530" height="54" rx="6" class="b"/>
<text x="1665.0" y="509" text-anchor="middle" class="bt">Runtime / Structural Resource Controls</text>
<text x="1665.0" y="526" text-anchor="middle" class="sm">result size, wall clock, memory/workspace, concurrency</text>
<rect x="1400" y="564" width="530" height="54" rx="6" class="b"/>
<text x="1665.0" y="583" text-anchor="middle" class="bt">Tenant / Data Isolation</text>
<text x="1665.0" y="600" text-anchor="middle" class="sm">store isolation, tenant cache keys, retrieval/provider policy</text>
<rect x="1400" y="638" width="530" height="54" rx="6" class="b"/>
<text x="1665.0" y="657" text-anchor="middle" class="bt">Offline Calibration -&gt; Validated Promotion</text>
<text x="1665.0" y="674" text-anchor="middle" class="sm">teacher corrections + benchmark data; controlled versioned change</text>
<path d="M1665,174 L1665,194" class="ar"/>
<path d="M1665,322 L1665,342" class="ar"/>
<rect x="390" y="500" width="940" height="620" rx="8" class="cl"/><text x="402" y="524" class="ct">D. Verification-First Grading Core</text>
<rect x="460" y="540" width="800" height="62" rx="6" class="b"/>
<text x="860.0" y="559" text-anchor="middle" class="bt">Pre-Evaluation Safety Gate</text>
<text x="860.0" y="576" text-anchor="middle" class="sm">ACTIVE authority, question/evidence binding, evidence usability, limits</text>
<rect x="460" y="625" width="385" height="62" rx="6" class="b"/>
<text x="652.5" y="644" text-anchor="middle" class="bt">Versioned Evaluator Selection Policy</text>
<text x="652.5" y="661" text-anchor="middle" class="sm">authoritative classification -&gt; exact capability ref; no subject hardcoding</text>
<rect x="875" y="625" width="385" height="62" rx="6" class="b"/>
<text x="1067.5" y="644" text-anchor="middle" class="bt">Capability Registry</text>
<text x="1067.5" y="661" text-anchor="middle" class="sm">exact record resolution; registry metadata is not execution authority</text>
<rect x="600" y="710" width="520" height="62" rx="6" class="b"/>
<text x="860.0" y="729" text-anchor="middle" class="bt">Evaluator Execution Boundary</text>
<text x="860.0" y="746" text-anchor="middle" class="sm">selected capability + evaluation_attempt_id + execution provenance</text>
<rect x="430" y="795" width="260" height="68" rx="6" class="b"/>
<text x="560.0" y="814" text-anchor="middle" class="bt">Deterministic Evaluators</text>
<text x="560.0" y="831" text-anchor="middle" class="sm">CHOICE / exact / bounded NUMERIC / supported units</text>
<rect x="730" y="795" width="260" height="68" rx="6" class="b"/>
<text x="860.0" y="814" text-anchor="middle" class="bt">Semantic Evaluator</text>
<text x="860.0" y="831" text-anchor="middle" class="sm">structured criterion-level judgments only</text>
<rect x="1030" y="795" width="260" height="68" rx="6" class="b"/>
<text x="1160.0" y="814" text-anchor="middle" class="bt">Math / Domain Checks</text>
<text x="1160.0" y="831" text-anchor="middle" class="sm">independent unit/symbolic/reference/derivation checks</text>
<rect x="555" y="890" width="610" height="62" rx="6" class="b"/>
<text x="860.0" y="909" text-anchor="middle" class="bt">CriterionJudgment(s)</text>
<text x="860.0" y="926" text-anchor="middle" class="sm">criterion, approved level/projection, evidence refs, reasons, uncertainty</text>
<rect x="555" y="972" width="610" height="62" rx="6" class="b"/>
<text x="860.0" y="991" text-anchor="middle" class="bt">Judgment + Evidence / Domain Verification</text>
<text x="860.0" y="1008" text-anchor="middle" class="sm">criterion/evidence binding + independent checks</text>
<rect x="555" y="1054" width="610" height="48" rx="6" class="b"/>
<text x="860.0" y="1073" text-anchor="middle" class="bt">Frozen Deterministic Scoring Kernel</text>
<text x="860.0" y="1090" text-anchor="middle" class="sm">rubric rules -&gt; authoritative marks, gates/caps/deductions/rounding/bounds</text>
<rect x="415" y="890" width="120" height="144" rx="6" class="db"/>
<text x="475.0" y="909" text-anchor="middle" class="bt">Fail-Closed</text>
<text x="475.0" y="926" text-anchor="middle" class="sm">technical/validation/provider failure</text>
<text x="475.0" y="940" text-anchor="middle" class="sm">never becomes student error</text>
